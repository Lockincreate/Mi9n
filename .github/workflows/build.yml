name: Build Mi9n APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: flutter create . --project-name mi9n --org com.kasi.mi9n
      - run: |
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          void main() => runApp(MaterialApp(debugShowCheckedModeBanner:false, home:Scaffold(appBar:AppBar(backgroundColor:Color(0xFF0e5ab0), title:Text("Mi9n • Blue Feather")), body:Center(child:Column(mainAxisAlignment:MainAxisAlignment.center, children:[Icon(Icons.remove_red_eye,size:80,color:Color(0xFF0e5ab0)), Text("Mi9n",style:TextStyle(fontSize:40,fontWeight:FontWeight.w900,color:Color(0xFF0e5ab0))), Text("Kasi Chat • 0 Data Mode ON")])))));
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Mi9n-APK
          path: build/app/outputs/flutter-apk/app-release.apk
